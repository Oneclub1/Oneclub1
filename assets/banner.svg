<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Fabian – Apps, KI-Agenten, Server und Hardware aus einer Hand">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E2DED3"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#F6F5F1"/>
  <rect x="700" y="0" width="500" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="none" stroke="#E2DED3"/>

  <!-- Leiterbahnen: Sensor -> Chip -> Server -> App -->
  <g fill="none" stroke="#CFC9BB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M752 150 H800"/>
    <path d="M880 150 H930 V90 H976"/>
    <path d="M930 150 V210 H976"/>
    <path d="M1036 90 H1080 V150 H1104"/>
    <path d="M1036 210 H1080 V150"/>
  </g>
  <g fill="#C8643C">
    <circle cx="930" cy="150" r="5"/>
    <circle cx="1080" cy="150" r="5"/>
  </g>

  <!-- Sensor -->
  <g>
    <circle cx="736" cy="150" r="16" fill="#FFFFFF" stroke="#2B2A27" stroke-width="2"/>
    <path d="M728 150 q4 -8 8 0 t8 0" fill="none" stroke="#C8643C" stroke-width="2"/>
  </g>
  <!-- Mikrocontroller -->
  <g stroke="#2B2A27" stroke-width="2">
    <path d="M816 118 V108 M832 118 V108 M848 118 V108 M864 118 V108 M816 182 V192 M832 182 V192 M848 182 V192 M864 182 V192"/>
    <rect x="800" y="118" width="80" height="64" rx="8" fill="#FFFFFF"/>
  </g>
  <text x="840" y="156" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2A27">ESP32</text>
  <!-- Server -->
  <g stroke="#2B2A27" stroke-width="2" fill="#FFFFFF">
    <rect x="976" y="66" width="60" height="22" rx="4"/>
    <rect x="976" y="92" width="60" height="22" rx="4"/>
  </g>
  <circle cx="988" cy="77" r="3" fill="#C8643C"/><circle cx="988" cy="103" r="3" fill="#C8643C"/>
  <!-- KI-Agent -->
  <g stroke="#2B2A27" stroke-width="2" fill="#FFFFFF">
    <rect x="976" y="186" width="60" height="48" rx="10"/>
  </g>
  <text x="1006" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2B2A27">KI</text>
  <!-- Smartphone -->
  <g stroke="#2B2A27" stroke-width="2" fill="#FFFFFF">
    <rect x="1104" y="104" width="52" height="92" rx="10"/>
  </g>
  <g fill="#C8643C"><rect x="1114" y="120" width="32" height="6" rx="3"/></g>
  <g fill="#E2DED3"><rect x="1114" y="134" width="32" height="6" rx="3"/><rect x="1114" y="148" width="22" height="6" rx="3"/><rect x="1114" y="162" width="32" height="6" rx="3"/></g>

  <!-- Text -->
  <text x="64" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#C8643C">AUGSMENTED</text>
  <text x="62" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#2B2A27">Fabian</text>
  <text x="64" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#55524B">Vom Sensor bis zur App: Hardware, Server,</text>
  <text x="64" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#55524B">KI-Agenten und Apps aus einer Hand.</text>
</svg>
